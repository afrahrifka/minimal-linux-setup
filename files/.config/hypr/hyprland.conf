# Portable minimal keyboard desktop.
source = env.conf
source = monitors.conf
source = workspaces.conf
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = ~/.local/bin/minimal-session-lock
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = ~/.local/bin/minimal-monitor-power
exec-once = hypridle
exec-once = hyprctl dispatch submap reset
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgb(688aaa)
    col.inactive_border = rgb(252525)
    layout = dwindle
}
decoration {
    rounding = 0
    active_opacity = 1
    inactive_opacity = 1
    dim_inactive = false
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(101010)
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
}
dwindle {
    preserve_split = true
}
submap = reset
bind = SUPER, Return, exec, kitty -1
bind = SUPER, D, exec, ~/.local/bin/toggle-app-search
bind = SUPER, B, exec, qutebrowser
bind = SUPER, E, exec, dolphin
bind = SUPER, N, exec, kitty -1 nvim
bind = SUPER, M, exec, mpv --player-operation-mode=pseudo-gui
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo,
bind = SUPER SHIFT, R, exec, hyprctl reload
bind = SUPER SHIFT, E, exit,
bind = SUPER, Down, movefocus, d
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Tab, cyclenext,
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = SUPER, 1, workspace, 1
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Scratchpad and standalone Super launcher.
bind = SUPER, S, togglespecialworkspace,
bind = SUPER ALT, S, movetoworkspacesilent, special
bind = SUPER SHIFT, S, movetoworkspacesilent, special
bindr = SUPER, Super_L, exec, ~/.local/bin/toggle-app-search
bindr = SUPER, Super_R, exec, ~/.local/bin/toggle-app-search

# Vim-style window navigation and movement.
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER CTRL, L, exec, hyprlock

# Open terminal.
bind = SUPER, T, exec, kitty -1
